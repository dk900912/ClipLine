<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="ClipLine 双线 动态标识演示">
  <defs>
    <linearGradient id="emLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F5BD5"/>
      <stop offset="0.5" stop-color="#6C63F4"/>
      <stop offset="1" stop-color="#2AA9E0"/>
    </linearGradient>
    <linearGradient id="emClip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7BB5C"/>
      <stop offset="1" stop-color="#EF8A24"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="#F4F6FC"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#E3E8F6" stroke-width="2"/>
  <path d="M24 78 Q128 78 232 78" fill="none" stroke="url(#emLine)" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0;0.42;0.78;1"
             keySplines="0.22 0.61 0.36 1;0 0 1 1;0.4 0 0.2 1"
             values="M24 78 Q128 78 232 78;M24 120 Q128 174 232 120;M24 120 Q128 174 232 120;M24 78 Q128 78 232 78"/>
  </path>
  <rect x="115" y="60" width="26" height="94" rx="11" fill="url(#emClip)">
    <animate attributeName="y" dur="3.2s" repeatCount="indefinite"
             keyTimes="0;0.42;0.78;1" values="52;60;60;52"/>
  </rect>
  <circle cx="128" cy="170" r="8" fill="#4F5BD5">
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite"
             keyTimes="0;0.42;0.78;1" values="0;1;1;0"/>
  </circle>
</svg>
